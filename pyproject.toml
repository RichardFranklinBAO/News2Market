[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news2market"
version = "0.1.0"
description = "Auditable news and SEC financial-text research prototype"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news2market*"]

[tool.setuptools.package-data]
news2market = ["ui/*.html"]
