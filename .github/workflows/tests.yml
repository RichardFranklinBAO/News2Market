name: Offline research tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q run_all.py src/news2market scripts tests
      - name: Verify unified CLI loads and prints help\n        run: python run_all.py --help\n      - name: Run local fixtures only (no SEC or price-provider network)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
